services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopping_assistant
      POSTGRES_USER: shopping_assistant
      POSTGRES_PASSWORD: shopping_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
